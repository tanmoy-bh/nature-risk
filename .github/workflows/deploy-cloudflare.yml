name: Deploy to Cloudflare Pages

# Served at https://projects.tanmoybh.com/nature-risk/ through the projects hub,
# which proxies /nature-risk/* to this Pages project.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

env:
  PROJECT_NAME: tanmoybh-nature-risk

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://projects.tanmoybh.com/nature-risk/
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Test passphrase gate
        run: node --test

      - name: Build
        run: node scripts/build.mjs

      - name: Check passphrase secret
        env:
          NATURE_RISK_PASSPHRASE: ${{ secrets.NATURE_RISK_PASSPHRASE }}
        run: |
          if [ -z "$NATURE_RISK_PASSPHRASE" ]; then
            echo "::error::Add the NATURE_RISK_PASSPHRASE repository secret before deploying."
            exit 1
          fi

      - name: Ensure Pages project exists
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        continue-on-error: true
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create ${{ env.PROJECT_NAME }} --production-branch=main

      # Secrets apply to the next deployment, so set it before deploying.
      - name: Set access passphrase
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NATURE_RISK_PASSPHRASE: ${{ secrets.NATURE_RISK_PASSPHRASE }}
        run: printf '%s' "$NATURE_RISK_PASSPHRASE" | npx --yes wrangler@4.40.0 pages secret put ACCESS_PASSPHRASE --project-name="$PROJECT_NAME"

      - name: Deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: pages deploy dist --project-name=${{ env.PROJECT_NAME }} --branch=main --commit-dirty=true
