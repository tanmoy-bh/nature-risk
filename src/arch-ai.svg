<svg class="dg" viewBox="0 0 1240 600" role="img" aria-label="AI routing with Jev across System 1 and System 2 models"><text class="zl" x="20" y="36">CALLERS</text><g class="node z-plat"><rect x="20" y="52" width="200" height="46" rx="9"/><use href="#dgi-chip" class="ic z-plat" x="30" y="65" width="20" height="20"/><text class="t" x="60" y="72">Raster workers</text><text class="m" x="60" y="87">cloud, land cover</text></g><path class="ar" d="M220,75 L262,75"/><g class="node z-plat"><rect x="20" y="128" width="200" height="46" rx="9"/><use href="#dgi-check" class="ic z-plat" x="30" y="141" width="20" height="20"/><text class="t" x="60" y="148">Partner validator</text><text class="m" x="60" y="163">document fields</text></g><path class="ar" d="M220,151 L262,151"/><g class="node z-plat"><rect x="20" y="204" width="200" height="46" rx="9"/><use href="#dgi-server" class="ic z-plat" x="30" y="217" width="20" height="20"/><text class="t" x="60" y="224">Scoring API</text><text class="m" x="60" y="239">reason codes</text></g><path class="ar" d="M220,227 L262,227"/><g class="node z-plat"><rect x="20" y="280" width="200" height="46" rx="9"/><use href="#dgi-note" class="ic z-plat" x="30" y="293" width="20" height="20"/><text class="t" x="60" y="300">Notes service</text><text class="m" x="60" y="315">triage, drafts</text></g><path class="ar" d="M220,303 L262,303"/><g class="node z-plat"><rect x="20" y="356" width="200" height="46" rx="9"/><use href="#dgi-plug" class="ic z-plat" x="30" y="369" width="20" height="20"/><text class="t" x="60" y="376">MCP Q&amp;A agent</text><text class="m" x="60" y="391">analyst questions</text></g><path class="ar" d="M220,379 L262,379"/><path class="ar" d="M262,75 L262,381"/><path class="ar" d="M262,228 L300,228" marker-end="url(#dg-ah)"/><g class="zone z-ai"><rect x="296" y="52" width="238" height="352" rx="14" stroke-dasharray="5 5"/><text class="zl" x="310" y="72">JEV ROUTER</text></g><g class="node z-ai"><rect x="312" y="80" width="206" height="308" rx="10"/><rect class="badge" x="322" y="90" width="26" height="26" rx="7"/><use href="#dgi-split" class="ic" x="326" y="94" width="18" height="18"/><text class="t" x="356" y="108">Routing policy</text><text class="m" x="324" y="130">per request</text><text class="s" x="324" y="144">1  Task type and tenant</text><text class="s" x="324" y="158">2  Latency target</text><text class="s" x="324" y="172">3  Cost budget left</text><text class="s" x="324" y="186">4  Live eval score</text><text class="s" x="324" y="200">    per model and task</text><text class="s" x="324" y="214">5  Escalate when System 1</text><text class="s" x="324" y="228">    confidence is low</text><text class="s" x="324" y="242">6  Fall back when a</text><text class="s" x="324" y="256">    provider fails</text><text class="s" x="324" y="270"></text><text class="s" x="324" y="284">Every call: trace, tokens,</text><text class="s" x="324" y="298">cost, model, verdict</text></g><g class="zone z-ai"><rect x="590" y="52" width="330" height="196" rx="14" stroke-dasharray="5 5"/><text class="zl" x="604" y="72">SYSTEM 1 · FAST, NARROW, CHEAP</text></g><g class="node z-ai"><rect x="606" y="80" width="298" height="46" rx="9"/><use href="#dgi-gpu" class="ic z-ai" x="616" y="93" width="20" height="20"/><text class="t" x="646" y="100">Cloud and land-cover models</text><text class="m" x="646" y="115">segmentation · self-hosted GPU</text></g><g class="node z-ai"><rect x="606" y="134" width="298" height="46" rx="9"/><use href="#dgi-vector" class="ic z-ai" x="616" y="147" width="20" height="20"/><text class="t" x="646" y="154">Embedding model</text><text class="m" x="646" y="169">evidence and methodology text</text></g><g class="node z-ai"><rect x="606" y="188" width="298" height="46" rx="9"/><use href="#dgi-bolt" class="ic z-ai" x="616" y="201" width="20" height="20"/><text class="t" x="646" y="208">Small LLM</text><text class="m" x="646" y="223">extraction · reason codes · triage</text></g><g class="zone z-ai"><rect x="590" y="284" width="330" height="142" rx="14" stroke-dasharray="5 5"/><text class="zl" x="604" y="304">SYSTEM 2 · DELIBERATE</text></g><g class="node z-ai"><rect x="606" y="312" width="298" height="46" rx="9"/><use href="#dgi-brain" class="ic z-ai" x="616" y="325" width="20" height="20"/><text class="t" x="646" y="332">Frontier LLM</text><text class="m" x="646" y="347">credit notes · explanations</text></g><g class="node z-ai"><rect x="606" y="366" width="298" height="46" rx="9"/><use href="#dgi-chat" class="ic z-ai" x="616" y="379" width="20" height="20"/><text class="t" x="646" y="386">LLM with tools</text><text class="m" x="646" y="401">MCP Q&amp;A agent over the API</text></g><path class="ar" d="M518,160 L590,150" marker-end="url(#dg-ah)"/><text class="al" x="530" y="146">most calls</text><path class="ar" d="M518,340 L590,355" marker-end="url(#dg-ah)"/><text class="al" x="532" y="368">hard calls</text><path class="ar ret" d="M755,248 L755,284" marker-end="url(#dg-ah)"/><text class="al" x="762" y="270">escalate</text><g class="zone z-ai"><rect x="976" y="52" width="248" height="274" rx="14" stroke-dasharray="5 5"/><text class="zl" x="990" y="72">GUARDRAILS AND EVALS</text></g><g class="node z-ai"><rect x="992" y="80" width="216" height="230" rx="10"/><rect class="badge" x="1002" y="90" width="26" height="26" rx="7"/><use href="#dgi-shieldcheck" class="ic" x="1006" y="94" width="18" height="18"/><text class="t" x="1036" y="108">Before release</text><text class="m" x="1004" y="130">every answer</text><text class="s" x="1004" y="144">Numbers match the evidence</text><text class="s" x="1004" y="158">Every claim cites an ID</text><text class="s" x="1004" y="172">Personal data scrubbed</text><text class="s" x="1004" y="186">  before any model call</text><text class="s" x="1004" y="200">Tenant data never used</text><text class="s" x="1004" y="214">  to train models</text><text class="s" x="1004" y="228">Failed checks go to a</text><text class="s" x="1004" y="242">  person, not the client</text></g><path class="ar" d="M920,150 L976,170" marker-end="url(#dg-ah)"/><path class="ar" d="M920,355 L976,290" marker-end="url(#dg-ah)"/><g class="node z-client"><rect x="992" y="352" width="216" height="74" rx="10"/><rect class="badge" x="1002" y="362" width="26" height="26" rx="7"/><use href="#dgi-user" class="ic" x="1006" y="366" width="18" height="18"/><text class="t" x="1036" y="380">Answer to caller</text><text class="m" x="1004" y="402">or analyst queue</text><text class="s" x="1004" y="416">Logged in the audit log</text></g><path class="ar" d="M1100,326 L1100,352" marker-end="url(#dg-ah)"/><path class="ar" d="M1100,426 L1100,470 L407,470 L407,404" marker-end="url(#dg-ah)"/><text class="al" x="430" y="462">feedback: analyst edits and nightly eval suites update each model's score, which changes routing</text><line class="hair" x1="20" y1="500" x2="1220" y2="500"/><text class="zl" x="20" y="526">DEFAULT</text><text class="s" x="20" y="546">System 1 first; escalate only when needed</text><text class="zl" x="325" y="526">NEVER</text><text class="s" x="325" y="546">AI does not set a score or label</text><text class="zl" x="630" y="526">BUDGETS</text><text class="s" x="630" y="546">per tenant and per task, enforced by Jev</text><text class="zl" x="935" y="526">SWAPPABLE</text><text class="s" x="935" y="546">models change without code changes</text></svg>