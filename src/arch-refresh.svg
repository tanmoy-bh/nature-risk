<svg class="dg" viewBox="0 0 1240 480" role="img" aria-label="Data refresh and alert pipeline"><g class="node z-ext"><rect x="20" y="60" width="214" height="130" rx="10"/><rect class="badge" x="30" y="70" width="26" height="26" rx="7"/><use href="#dgi-radar" class="ic" x="34" y="74" width="18" height="18"/><text class="t" x="64" y="88">Source releases</text><text class="m" x="32" y="110">STAC poll · versions</text><text class="s" x="32" y="124">New satellite scenes, a</text><text class="s" x="32" y="138">yearly forest-loss version,</text><text class="s" x="32" y="152">a new water baseline</text></g><circle class="step" cx="214" cy="80" r="11"/><text class="stepn" x="214" y="84">1</text><g class="node z-plat"><rect x="270" y="60" width="214" height="130" rx="10"/><rect class="badge" x="280" y="70" width="26" height="26" rx="7"/><use href="#dgi-grid" class="ic" x="284" y="74" width="18" height="18"/><text class="t" x="314" y="88">Affected sites</text><text class="m" x="282" y="110">tile index · PostGIS</text><text class="s" x="282" y="124">Only sites whose tiles</text><text class="s" x="282" y="138">changed are recomputed,</text><text class="s" x="282" y="152">not the whole book</text></g><circle class="step" cx="464" cy="80" r="11"/><text class="stepn" x="464" y="84">2</text><path class="ar" d="M234,125 L270,125" marker-end="url(#dg-ah)"/><g class="node z-plat"><rect x="520" y="60" width="214" height="130" rx="10"/><rect class="badge" x="530" y="70" width="26" height="26" rx="7"/><use href="#dgi-chip" class="ic" x="534" y="74" width="18" height="18"/><text class="t" x="564" y="88">Recompute</text><text class="m" x="532" y="110">Dask workers</text><text class="s" x="532" y="124">Append new rows pinned</text><text class="s" x="532" y="138">to the source snapshot;</text><text class="s" x="532" y="152">old rows are kept</text></g><circle class="step" cx="714" cy="80" r="11"/><text class="stepn" x="714" y="84">3</text><path class="ar" d="M484,125 L520,125" marker-end="url(#dg-ah)"/><g class="node z-plat"><rect x="770" y="60" width="214" height="130" rx="10"/><rect class="badge" x="780" y="70" width="26" height="26" rx="7"/><use href="#dgi-sliders" class="ic" x="784" y="74" width="18" height="18"/><text class="t" x="814" y="88">Re-score</text><text class="m" x="782" y="110">signal engine v0.1</text><text class="s" x="782" y="124">New label vs last label</text><text class="s" x="782" y="138">per site and scenario;</text><text class="s" x="782" y="152">portfolio totals updated</text></g><circle class="step" cx="964" cy="80" r="11"/><text class="stepn" x="964" y="84">4</text><path class="ar" d="M734,125 L770,125" marker-end="url(#dg-ah)"/><path class="ar" d="M984,125 L1020,125" marker-end="url(#dg-ah)"/><g class="decision"><path d="M1110,73.0 L1200.0,125 L1110,177.0 L1020.0,125 Z"/><text class="t" text-anchor="middle" x="1110" y="125">Label changed?</text><text class="s" text-anchor="middle" x="1110" y="140">Risk · Stable · Gain</text></g><path class="ar" d="M1200,125 L1220,125"/><text class="al" x="1198" y="112">no</text><text class="s" x="1170" y="196">no: log only</text><path class="ar" d="M1110,177 L1110,240 L127.0,240 L127.0,268" marker-end="url(#dg-ah)"/><text class="al" x="1118" y="214">yes</text><g class="node z-client"><rect x="20" y="268" width="214" height="108" rx="10"/><rect class="badge" x="30" y="278" width="26" height="26" rx="7"/><use href="#dgi-send" class="ic" x="34" y="282" width="18" height="18"/><text class="t" x="64" y="296">Webhook to bank</text><text class="m" x="32" y="318">label.changed · signed</text><text class="s" x="32" y="332">Retries for 24 hours,</text><text class="s" x="32" y="346">then flags the client</text></g><path class="ar" d="M413.0,240 L413.0,268" marker-end="url(#dg-ah)"/><g class="node z-edge"><rect x="306" y="268" width="214" height="108" rx="10"/><rect class="badge" x="316" y="278" width="26" height="26" rx="7"/><use href="#dgi-bell" class="ic" x="320" y="282" width="18" height="18"/><text class="t" x="350" y="296">Web app alert</text><text class="m" x="318" y="318">per portfolio</text><text class="s" x="318" y="332">Shows on the lender desk</text><text class="s" x="318" y="346">with the evidence that moved</text></g><path class="ar" d="M699.0,240 L699.0,268" marker-end="url(#dg-ah)"/><g class="node z-plat"><rect x="592" y="268" width="214" height="108" rx="10"/><rect class="badge" x="602" y="278" width="26" height="26" rx="7"/><use href="#dgi-sparkle" class="ic" x="606" y="282" width="18" height="18"/><text class="t" x="636" y="296">AI credit note</text><text class="m" x="604" y="318">RAG over evidence</text><text class="s" x="604" y="332">Eval gate checks every</text><text class="s" x="604" y="346">number before release</text></g><g class="node z-client"><rect x="878" y="268" width="214" height="108" rx="10"/><rect class="badge" x="888" y="278" width="26" height="26" rx="7"/><use href="#dgi-user" class="ic" x="892" y="282" width="18" height="18"/><text class="t" x="922" y="296">Analyst reviews</text><text class="m" x="890" y="318">human in the loop</text><text class="s" x="890" y="332">Accepts, edits or rejects;</text><text class="s" x="890" y="346">decision goes to audit log</text></g><path class="ar" d="M806,322 L878,322" marker-end="url(#dg-ah)"/><line class="hair" x1="20" y1="404" x2="1220" y2="404"/><text class="zl" x="20" y="428">FRESHNESS</text><text class="s" x="20" y="448">within 24 hours of a source release</text><text class="zl" x="325" y="428">BLAST RADIUS</text><text class="s" x="325" y="448">only changed tiles are recomputed</text><text class="zl" x="630" y="428">REPRODUCIBLE</text><text class="s" x="630" y="448">any past score = observations + method version</text><text class="zl" x="935" y="428">DELIVERY</text><text class="s" x="935" y="448">at-least-once, idempotent by event ID</text></svg>